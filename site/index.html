<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Choose Japanese or English for the iroha-zip website.">
    <meta name="theme-color" content="#3858c9">
    <title>iroha-zip — Language / 言語</title>
    <link rel="stylesheet" href="assets/styles.css">
    <script defer src="assets/site.js"></script>
  </head>
  <body data-page="language-gate">
    <main class="language-gate">
      <section class="language-card" aria-labelledby="language-title">
        <a class="brand" href="https://github.com/hjosugi/iroha-zip">
          <span class="brand-mark" aria-hidden="true"></span>
          <span>iroha-zip</span>
        </a>
        <h1 id="language-title">言語を選択<br><span lang="en">Choose a language</span></h1>
        <p>Windows用の安全志向アーカイブラッパー<br><span lang="en">Security-oriented archive wrapper for Windows</span></p>
        <div class="language-options">
          <a class="language-option" href="ja/" data-language-choice="ja">日本語</a>
          <a class="language-option" href="en/" data-language-choice="en" lang="en">English</a>
        </div>
      </section>
    </main>
  </body>
</html>
