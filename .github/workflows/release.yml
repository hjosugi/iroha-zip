name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vX.Y.Z tag (required only when publishing)
        required: false
        type: string
      publish:
        description: Publish the existing tag as the stable GitHub Release
        required: false
        default: false
        type: boolean

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release-context:
    name: Validate version, tag, and source
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      commit: ${{ steps.release.outputs.commit }}
      publish: ${{ steps.release.outputs.publish }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}

    steps:
      - name: Check out the requested source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Validate tag, version, and source commit
        id: release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          REQUESTED_TAG: ${{ inputs.tag }}
          PUBLISH_RELEASE: ${{ github.event_name == 'push' || inputs.publish }}
        run: |
          $version = (Select-String -LiteralPath Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          $publish = $env:PUBLISH_RELEASE -ceq 'true'
          $requestedTag = if ($env:GITHUB_EVENT_NAME -ceq 'workflow_dispatch') {
            ([string]$env:REQUESTED_TAG).Trim()
          } else {
            $env:RELEASE_TAG
          }
          if ($publish -and [string]::IsNullOrWhiteSpace($requestedTag)) {
            throw 'Manual publication requires an existing vX.Y.Z tag.'
          }
          $releaseTag = if ([string]::IsNullOrWhiteSpace($requestedTag)) {
            "v$version"
          } else {
            $requestedTag
          }
          if ($releaseTag -cnotmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') {
            throw "Release tag must have the exact form vX.Y.Z: $releaseTag"
          }
          if ($releaseTag -cne "v$version") {
            throw "Tag $releaseTag does not match Cargo.toml version $version."
          }

          $checkedOutCommit = (& git rev-parse HEAD).Trim()
          if (-not [string]::IsNullOrWhiteSpace($requestedTag)) {
            $tagCommit = (& git rev-parse "$releaseTag^{commit}").Trim()
            if ($LASTEXITCODE -ne 0 -or $checkedOutCommit -cne $tagCommit) {
              throw 'The checked-out commit does not match the release tag.'
            }
          }
          $remoteMain = (& gh api "repos/$env:GITHUB_REPOSITORY/commits/main" --jq .sha).Trim()
          if ($LASTEXITCODE -ne 0 -or $remoteMain -cne $checkedOutCommit) {
            throw 'Release tags and dry runs must point to the current main commit.'
          }

          "commit=$checkedOutCommit" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "tag=$releaseTag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "publish=$($publish.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

  windows-package:
    name: Build and attest Windows ${{ matrix.architecture }}
    needs: release-context
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    permissions:
      attestations: write
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x64
            runtime_architecture: X64
            runner: windows-2025
            rust_host: x86_64-pc-windows-msvc
            target: x86_64-pc-windows-msvc
          - architecture: arm64
            runtime_architecture: Arm64
            runner: windows-11-arm
            rust_host: aarch64-pc-windows-msvc
            target: aarch64-pc-windows-msvc

    steps:
      - name: Check out the validated source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ needs.release-context.outputs.commit }}

      - name: Install pinned native Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy
          rustup default 1.97.1

      - name: Require the native runner architecture
        shell: pwsh
        env:
          EXPECTED_ARCHITECTURE: ${{ matrix.runtime_architecture }}
          EXPECTED_RUST_HOST: ${{ matrix.rust_host }}
        run: |
          $os = [Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString()
          $process = [Runtime.InteropServices.RuntimeInformation]::ProcessArchitecture.ToString()
          $hostLine = rustc -vV | Where-Object { $_ -like 'host:*' }
          if ($os -cne $env:EXPECTED_ARCHITECTURE -or
              $process -cne $env:EXPECTED_ARCHITECTURE -or
              $hostLine -cne "host: $env:EXPECTED_RUST_HOST") {
            throw "Native runner mismatch: os=$os process=$process rust=$hostLine"
          }

      - name: Validate, build, and package unsigned executables
        shell: pwsh
        env:
          RELEASE_TARGET: ${{ matrix.target }}
        run: |
          ./scripts/build-release.ps1 -Target $env:RELEASE_TARGET
          & git diff --exit-code HEAD --
          if ($LASTEXITCODE -ne 0) {
            throw 'The release build modified tracked source files.'
          }

      - name: Stage exact architecture-specific assets
        id: assets
        shell: pwsh
        env:
          RELEASE_TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.release-context.outputs.version }}
        run: >-
          ./scripts/stage-release-assets.ps1
          -Version $env:VERSION
          -Target $env:RELEASE_TARGET
          -OutputFile $env:GITHUB_OUTPUT

      - name: Attest the architecture-specific binaries and package
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            ${{ steps.assets.outputs.zip }}
            ${{ steps.assets.outputs.main_exe }}
            ${{ steps.assets.outputs.settings_exe }}
            ${{ steps.assets.outputs.shell_exe }}

      - name: Preserve exact architecture-specific assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: iroha-zip-${{ needs.release-context.outputs.version }}-windows-${{ matrix.architecture }}-attempt-${{ github.run_attempt }}
          path: ${{ steps.assets.outputs.asset_root }}/*
          if-no-files-found: error
          retention-days: 30

  publish-release:
    name: Assemble, attest, and publish the stable release
    needs: [release-context, windows-package]
    runs-on: windows-2025
    timeout-minutes: 30
    permissions:
      attestations: write
      contents: write
      id-token: write

    steps:
      - name: Check out the validated source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ needs.release-context.outputs.commit }}

      - name: Download both architecture artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.0
        with:
          pattern: iroha-zip-${{ needs.release-context.outputs.version }}-windows-*-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-assets
          merge-multiple: true

      - name: Reject architecture mix-ups and assemble checksums
        id: assets
        shell: pwsh
        env:
          VERSION: ${{ needs.release-context.outputs.version }}
        run: >-
          ./scripts/assemble-release-assets.ps1
          -AssetRoot (Join-Path $env:RUNNER_TEMP 'release-assets')
          -Version $env:VERSION
          -OutputFile $env:GITHUB_OUTPUT

      - name: Attest the combined checksum inventory
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.assets.outputs.checksums }}

      - name: Preserve the complete dry-run or release inventory
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: iroha-zip-${{ needs.release-context.outputs.version }}-complete-release-attempt-${{ github.run_attempt }}
          path: ${{ steps.assets.outputs.asset_root }}/*
          if-no-files-found: error
          retention-days: 30

      - name: Summarize non-publishing validation
        if: needs.release-context.outputs.publish != 'true'
        shell: pwsh
        env:
          VERSION: ${{ needs.release-context.outputs.version }}
        run: |
          @"
          ## Dual-architecture unsigned release dry run succeeded

          Version **$env:VERSION** was validated and packaged natively for Windows x64 and ARM64.
          All direct and ZIP-contained executables passed PE architecture checks; exactly 11 assets
          were assembled, checksummed, attested, and retained. No tag or GitHub Release was created
          or changed.
          "@ | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8

      - name: Publish stable GitHub release
        if: needs.release-context.outputs.publish == 'true'
        shell: pwsh
        env:
          ASSET_ROOT: ${{ steps.assets.outputs.asset_root }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release-context.outputs.tag }}
          VERSION: ${{ needs.release-context.outputs.version }}
        run: |
          if (gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY 2>$null) {
            throw "Release $env:RELEASE_TAG already exists; assets are never overwritten."
          }
          $assetFiles = @(
            Get-ChildItem -LiteralPath $env:ASSET_ROOT -File -Force |
              Sort-Object Name |
              ForEach-Object { $_.FullName }
          )
          if ($assetFiles.Count -ne 11) {
            throw "Expected exactly 11 release assets; found $($assetFiles.Count)."
          }
          gh release create $env:RELEASE_TAG `
            $assetFiles `
            --repo $env:GITHUB_REPOSITORY `
            --verify-tag `
            --draft `
            --title "iroha-zip $env:VERSION" `
            --notes-file docs/RELEASE_NOTES.md
          if ($LASTEXITCODE -ne 0) {
            throw 'GitHub draft release creation failed.'
          }

          $draftJson = Join-Path $env:RUNNER_TEMP 'iroha-zip-release-draft.json'
          gh release view $env:RELEASE_TAG `
            --repo $env:GITHUB_REPOSITORY `
            --json isDraft,isImmutable,isPrerelease,assets | `
            Out-File -LiteralPath $draftJson -Encoding utf8
          if ($LASTEXITCODE -ne 0) {
            throw 'GitHub draft release readback failed.'
          }
          ./scripts/verify-release-inventory.ps1 `
            -ReleaseJson $draftJson `
            -AssetFiles $assetFiles `
            -ExpectedState Draft

          gh release edit $env:RELEASE_TAG `
            --repo $env:GITHUB_REPOSITORY `
            --verify-tag `
            --draft=false `
            --latest
          if ($LASTEXITCODE -ne 0) {
            throw 'GitHub release publication failed; the verified draft remains preserved.'
          }

      - name: Verify the published release inventory
        if: needs.release-context.outputs.publish == 'true'
        shell: pwsh
        env:
          ASSET_ROOT: ${{ steps.assets.outputs.asset_root }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release-context.outputs.tag }}
        run: |
          $assetFiles = @(
            Get-ChildItem -LiteralPath $env:ASSET_ROOT -File -Force |
              Sort-Object Name |
              ForEach-Object { $_.FullName }
          )
          $releaseJson = Join-Path $env:RUNNER_TEMP 'iroha-zip-release-published.json'
          gh release view $env:RELEASE_TAG `
            --repo $env:GITHUB_REPOSITORY `
            --json isDraft,isImmutable,isPrerelease,assets | `
            Out-File -LiteralPath $releaseJson -Encoding utf8
          if ($LASTEXITCODE -ne 0) {
            throw 'Published release readback failed.'
          }
          ./scripts/verify-release-inventory.ps1 `
            -ReleaseJson $releaseJson `
            -AssetFiles $assetFiles `
            -ExpectedState PublishedImmutable
          $latestTag = gh release view `
            --repo $env:GITHUB_REPOSITORY `
            --json tagName --jq .tagName
          if ($LASTEXITCODE -ne 0 -or $latestTag -cne $env:RELEASE_TAG) {
            throw 'The published release is not the latest stable release.'
          }
