name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vX.Y.Z tag (required only when publishing)
        required: false
        type: string
      publish:
        description: Publish the existing tag as the stable GitHub Release
        required: false
        default: false
        type: boolean

permissions:
  attestations: write
  contents: write
  id-token: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  windows-package:
    name: Build, attest, and publish Windows x64
    runs-on: windows-2025
    timeout-minutes: 60

    steps:
      - name: Check out the release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Validate tag, version, and source commit
        id: release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          REQUESTED_TAG: ${{ inputs.tag }}
          PUBLISH_RELEASE: ${{ github.event_name == 'push' || inputs.publish }}
        run: |
          $version = (Select-String -LiteralPath Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          $publish = $env:PUBLISH_RELEASE -ceq 'true'
          $requestedTag = if ($env:GITHUB_EVENT_NAME -ceq 'workflow_dispatch') {
            ([string]$env:REQUESTED_TAG).Trim()
          } else {
            $env:RELEASE_TAG
          }
          if ($publish -and [string]::IsNullOrWhiteSpace($requestedTag)) {
            throw 'Manual publication requires an existing vX.Y.Z tag.'
          }
          $releaseTag = if ([string]::IsNullOrWhiteSpace($requestedTag)) {
            "v$version"
          } else {
            $requestedTag
          }
          if ($releaseTag -cnotmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') {
            throw "Release tag must have the exact form vX.Y.Z: $releaseTag"
          }
          if ($releaseTag -cne "v$version") {
            throw "Tag $releaseTag does not match Cargo.toml version $version."
          }

          $checkedOutCommit = (& git rev-parse HEAD).Trim()
          if (-not [string]::IsNullOrWhiteSpace($requestedTag)) {
            $tagCommit = (& git rev-parse "$releaseTag^{commit}").Trim()
            if ($LASTEXITCODE -ne 0 -or $checkedOutCommit -cne $tagCommit) {
              throw 'The checked-out commit does not match the release tag.'
            }
          }
          $remoteMain = (& gh api "repos/$env:GITHUB_REPOSITORY/commits/main" --jq .sha).Trim()
          if ($LASTEXITCODE -ne 0 -or $remoteMain -cne $checkedOutCommit) {
            throw 'Release tags must point to the current main commit.'
          }

          "tag=$releaseTag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "publish=$($publish.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy
          rustup default 1.97.1

      - name: Validate, build, and package unsigned executables
        shell: pwsh
        run: |
          ./scripts/build-release.ps1
          & git diff --exit-code HEAD --
          if ($LASTEXITCODE -ne 0) {
            throw 'The release build modified tracked source files.'
          }

      - name: Stage individual executables and checksums
        id: assets
        shell: pwsh
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          $releaseRoot = Join-Path $env:GITHUB_WORKSPACE 'target\x86_64-pc-windows-msvc\release'
          $distRoot = Join-Path $env:GITHUB_WORKSPACE 'dist'
          $assetMap = [ordered]@{
            'iroha-zip.exe' = "iroha-zip-$env:VERSION-windows-x64.exe"
            'iroha-zip-settings.exe' = "iroha-zip-settings-$env:VERSION-windows-x64.exe"
            'iroha-zip-shell.exe' = "iroha-zip-shell-$env:VERSION-windows-x64.exe"
          }

          foreach ($entry in $assetMap.GetEnumerator()) {
            $source = Join-Path $releaseRoot $entry.Key
            $destination = Join-Path $distRoot $entry.Value
            if (-not (Test-Path -LiteralPath $source -PathType Leaf)) {
              throw "Release executable is missing: $source"
            }
            $header = [IO.File]::ReadAllBytes($source)[0..1]
            if ($header[0] -ne 0x4d -or $header[1] -ne 0x5a) {
              throw "Release executable is not a Windows PE file: $source"
            }
            Copy-Item -LiteralPath $source -Destination $destination
          }

          $zip = Join-Path $distRoot "iroha-zip-$env:VERSION-windows-x64.zip"
          $zipChecksum = "$zip.sha256"
          foreach ($required in @($zip, $zipChecksum)) {
            if (-not (Test-Path -LiteralPath $required -PathType Leaf)) {
              throw "Release asset is missing: $required"
            }
          }

          $publishedAssets = @($zip, $zipChecksum)
          $publishedAssets += @($assetMap.Values | ForEach-Object { Join-Path $distRoot $_ })
          $checksumLines = foreach ($asset in @($publishedAssets | Where-Object { $_ -notlike '*.sha256' })) {
            $hash = (Get-FileHash -LiteralPath $asset -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $([IO.Path]::GetFileName($asset))"
          }
          $checksums = Join-Path $distRoot 'SHA256SUMS.txt'
          [IO.File]::WriteAllText(
            $checksums,
            (($checksumLines -join "`n") + "`n"),
            [Text.UTF8Encoding]::new($false)
          )
          $publishedAssets += $checksums

          "zip=$zip" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "zip_checksum=$zipChecksum" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "main_exe=$(Join-Path $distRoot $assetMap['iroha-zip.exe'])" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "settings_exe=$(Join-Path $distRoot $assetMap['iroha-zip-settings.exe'])" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "shell_exe=$(Join-Path $distRoot $assetMap['iroha-zip-shell.exe'])" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "checksums=$checksums" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Attest published binaries and package
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            ${{ steps.assets.outputs.zip }}
            ${{ steps.assets.outputs.main_exe }}
            ${{ steps.assets.outputs.settings_exe }}
            ${{ steps.assets.outputs.shell_exe }}
            ${{ steps.assets.outputs.checksums }}

      - name: Preserve release assets as a workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: iroha-zip-${{ steps.release.outputs.version }}-windows-x64
          path: |
            ${{ steps.assets.outputs.zip }}
            ${{ steps.assets.outputs.zip_checksum }}
            ${{ steps.assets.outputs.main_exe }}
            ${{ steps.assets.outputs.settings_exe }}
            ${{ steps.assets.outputs.shell_exe }}
            ${{ steps.assets.outputs.checksums }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish stable GitHub release
        if: steps.release.outputs.publish == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
          ZIP: ${{ steps.assets.outputs.zip }}
          ZIP_CHECKSUM: ${{ steps.assets.outputs.zip_checksum }}
          MAIN_EXE: ${{ steps.assets.outputs.main_exe }}
          SETTINGS_EXE: ${{ steps.assets.outputs.settings_exe }}
          SHELL_EXE: ${{ steps.assets.outputs.shell_exe }}
          CHECKSUMS: ${{ steps.assets.outputs.checksums }}
        run: |
          if (gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY 2>$null) {
            throw "Release $env:RELEASE_TAG already exists; assets are never overwritten."
          }
          $assetFiles = @(
            $env:ZIP,
            $env:ZIP_CHECKSUM,
            $env:MAIN_EXE,
            $env:SETTINGS_EXE,
            $env:SHELL_EXE,
            $env:CHECKSUMS
          )
          gh release create $env:RELEASE_TAG `
            $assetFiles `
            --repo $env:GITHUB_REPOSITORY `
            --verify-tag `
            --draft `
            --title "iroha-zip $env:VERSION" `
            --notes-file docs/RELEASE_NOTES.md
          if ($LASTEXITCODE -ne 0) {
            throw 'GitHub draft release creation failed.'
          }

          $draftJson = Join-Path $env:RUNNER_TEMP 'iroha-zip-release-draft.json'
          gh release view $env:RELEASE_TAG `
            --repo $env:GITHUB_REPOSITORY `
            --json isDraft,isImmutable,isPrerelease,assets | `
            Out-File -LiteralPath $draftJson -Encoding utf8
          if ($LASTEXITCODE -ne 0) {
            throw 'GitHub draft release readback failed.'
          }
          ./scripts/verify-release-inventory.ps1 `
            -ReleaseJson $draftJson `
            -AssetFiles $assetFiles `
            -ExpectedState Draft

          gh release edit $env:RELEASE_TAG `
            --repo $env:GITHUB_REPOSITORY `
            --verify-tag `
            --draft=false `
            --latest
          if ($LASTEXITCODE -ne 0) {
            throw 'GitHub release publication failed; the verified draft was not intentionally removed.'
          }

      - name: Verify the published release inventory
        if: steps.release.outputs.publish == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          ZIP: ${{ steps.assets.outputs.zip }}
          ZIP_CHECKSUM: ${{ steps.assets.outputs.zip_checksum }}
          MAIN_EXE: ${{ steps.assets.outputs.main_exe }}
          SETTINGS_EXE: ${{ steps.assets.outputs.settings_exe }}
          SHELL_EXE: ${{ steps.assets.outputs.shell_exe }}
          CHECKSUMS: ${{ steps.assets.outputs.checksums }}
        run: |
          $releaseJson = Join-Path $env:RUNNER_TEMP 'iroha-zip-release-published.json'
          $release = gh release view $env:RELEASE_TAG `
            --repo $env:GITHUB_REPOSITORY `
            --json isDraft,isImmutable,isPrerelease,assets
          $release | Out-File -LiteralPath $releaseJson -Encoding utf8
          if ($LASTEXITCODE -ne 0) {
            throw 'Published release readback failed.'
          }
          ./scripts/verify-release-inventory.ps1 `
            -ReleaseJson $releaseJson `
            -AssetFiles @(
              $env:ZIP,
              $env:ZIP_CHECKSUM,
              $env:MAIN_EXE,
              $env:SETTINGS_EXE,
              $env:SHELL_EXE,
              $env:CHECKSUMS
            ) `
            -ExpectedState PublishedImmutable
          $latestTag = gh release view `
            --repo $env:GITHUB_REPOSITORY `
            --json tagName --jq .tagName
          if ($LASTEXITCODE -ne 0 -or $latestTag -cne $env:RELEASE_TAG) {
            throw 'The published release is not the latest stable release.'
          }

      - name: Summarize non-publishing validation
        if: steps.release.outputs.publish != 'true'
        shell: pwsh
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          @"
          ## Unsigned release dry run succeeded

          Version **$env:VERSION** was validated, built, packaged, attested, and preserved as a workflow artifact. No tag or GitHub Release was created or changed.
          "@ | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8
