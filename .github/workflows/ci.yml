name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install a current MSYS2 UCRT64 libarchive source
        if: runner.os == 'Windows'
        id: msys2
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2.32.0
        with:
          msystem: UCRT64
          update: true
          cache: false
          install: mingw-w64-ucrt-x86_64-libarchive

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy
          rustup default 1.97.1

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run tests
        run: cargo test --all-targets --locked

      - name: Run minimized fuzz regressions
        if: runner.os == 'Linux'
        run: cargo test --locked --features fuzzing --test fuzz_regressions

      - name: Type-check the locked fuzz workspace
        if: runner.os == 'Linux'
        run: cargo check --manifest-path fuzz/Cargo.toml --all-targets --locked

      - name: Run Clippy
        run: cargo clippy --all-targets --locked

      - name: Build release binaries
        run: cargo build --release --all-targets --locked

      - name: Verify supported and unsupported backend evidence flows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          $verified = Join-Path $env:RUNNER_TEMP 'iroha-zip-verified-backend'
          ./scripts/export-msys2-backend.ps1 `
            -Msys2Root $env:MSYS2_ROOT `
            -DestinationDirectory $verified
          ./target/release/iroha-zip.exe verify-backend-evidence `
            $verified --require-supported
          if ($LASTEXITCODE -ne 0) {
            throw 'Supported MSYS2 evidence validation failed.'
          }

          $localSource = Join-Path $env:RUNNER_TEMP 'iroha-zip-local-source'
          $localBackend = Join-Path $env:RUNNER_TEMP 'iroha-zip-local-backend'
          New-Item -ItemType Directory -Path $localSource | Out-Null
          New-Item -ItemType Directory -Path $localBackend | Out-Null
          New-Item -ItemType Directory `
            -Path (Join-Path $localSource '.iroha-zip-evidence') | Out-Null
          [IO.File]::WriteAllBytes(
            (Join-Path $localSource 'bsdtar.exe'),
            [Text.Encoding]::UTF8.GetBytes('test backend')
          )
          [IO.File]::WriteAllText(
            (Join-Path $localSource '.iroha-zip-evidence/stale.txt'),
            'stale evidence'
          )
          [IO.File]::WriteAllText(
            (Join-Path $localSource '.iroha-zip-evidence-notes.bin'),
            'ordinary payload with a similar name'
          )
          [IO.File]::WriteAllText(
            (Join-Path $localBackend 'preserve.marker'),
            'existing backend'
          )
          $rejected = $false
          try {
            ./scripts/install-backend.ps1 `
              -SourceDirectory $localSource `
              -DestinationDirectory $localBackend
          }
          catch {
            $rejected = $true
          }
          if (-not $rejected) {
            throw 'An unapproved local bundle was unexpectedly accepted.'
          }
          if (-not (Test-Path -LiteralPath `
              (Join-Path $localBackend 'preserve.marker') -PathType Leaf)) {
            throw 'Rejected import did not preserve the existing backend.'
          }
          ./scripts/install-backend.ps1 `
            -SourceDirectory $localSource `
            -DestinationDirectory $localBackend `
            -AllowUnsupportedSource
          if (Test-Path -LiteralPath `
              (Join-Path $localBackend '.iroha-zip-evidence/stale.txt')) {
            throw 'Stale source evidence was unexpectedly reused.'
          }
          if (-not (Test-Path -LiteralPath `
              (Join-Path $localBackend '.iroha-zip-evidence-notes.bin') `
              -PathType Leaf)) {
            throw 'An ordinary payload with a similar name was incorrectly excluded.'
          }
          ./target/release/iroha-zip.exe verify-backend-evidence $localBackend
          if ($LASTEXITCODE -ne 0) {
            throw 'Explicitly unsupported evidence validation failed.'
          }
          ./target/release/iroha-zip.exe verify-backend-evidence `
            $localBackend --require-supported
          if ($LASTEXITCODE -eq 0) {
            throw 'Unsupported evidence unexpectedly passed --require-supported.'
          }
          $global:LASTEXITCODE = 0

          Add-Content `
            -LiteralPath (Join-Path $localBackend '.iroha-zip-evidence/THIRD-PARTY-NOTICES.md') `
            -Value 'tampered'
          ./target/release/iroha-zip.exe verify-backend-evidence $localBackend
          if ($LASTEXITCODE -eq 0) {
            throw 'Tampered evidence unexpectedly passed validation.'
          }
          $global:LASTEXITCODE = 0

      - name: Exercise native settings accessibility contract
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          ./scripts/test-settings-ui.ps1
          -Executable ./target/release/iroha-zip-settings.exe

  windows-e2e:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install a current MSYS2 UCRT64 libarchive source
        id: msys2
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2.32.0
        with:
          msystem: UCRT64
          update: true
          cache: false
          install: mingw-w64-ucrt-x86_64-libarchive

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1

      - name: Build release binaries
        run: cargo build --release --locked

      - name: Export a verified backend
        shell: pwsh
        env:
          MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        run: >-
          ./scripts/export-msys2-backend.ps1
          -Msys2Root $env:MSYS2_ROOT
          -DestinationDirectory (Join-Path $env:RUNNER_TEMP 'iroha-zip-e2e-backend')

      - name: Exercise archive and isolation matrix
        shell: pwsh
        run: >-
          ./scripts/test-windows-e2e.ps1
          -Executable ./target/release/iroha-zip.exe
          -ShellExecutable ./target/release/iroha-zip-shell.exe
          -BackendDirectory (Join-Path $env:RUNNER_TEMP 'iroha-zip-e2e-backend')
          -EvidenceOutput (Join-Path $env:RUNNER_TEMP 'windows-e2e.json')

      - name: Exercise generated malicious archive corpus
        shell: pwsh
        env:
          IROHA_ZIP_CORPUS_EXECUTABLE: ${{ github.workspace }}/target/release/iroha-zip.exe
          IROHA_ZIP_CORPUS_BACKEND: ${{ runner.temp }}/iroha-zip-e2e-backend
          IROHA_ZIP_CORPUS_EVIDENCE: ${{ runner.temp }}/malicious-corpus.json
        run: >-
          cargo test --test malicious_archive_corpus --locked --
          --ignored --nocapture

      - name: Exercise settings-screen setup and diagnosis
        shell: pwsh
        run: >-
          ./scripts/test-settings-ui.ps1
          -Executable ./target/release/iroha-zip-settings.exe
          -BackendDirectory (Join-Path $env:RUNNER_TEMP 'iroha-zip-e2e-backend')
          -EvidenceOutput (Join-Path $env:RUNNER_TEMP 'settings-e2e.json')

      - name: Upload machine-readable Windows evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-e2e-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/windows-e2e.json
            ${{ runner.temp }}/settings-e2e.json
            ${{ runner.temp }}/malicious-corpus.json
          if-no-files-found: warn
          retention-days: 14

  dependency-policy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1

      - name: Install pinned dependency-policy tools
        run: |
          cargo install cargo-deny --version 0.19.9 --locked
          cargo install cargo-about --version 0.9.1 --locked --features cli

      - name: Check advisories, licenses, bans, and sources
        run: cargo deny check

      - name: Check fuzz-workspace dependencies
        run: >-
          cargo deny --manifest-path fuzz/Cargo.toml --locked check
          --config fuzz/deny.toml

      - name: Verify generated third-party license inventory
        shell: bash
        run: |
          cargo about generate --locked --all-features -o THIRD-PARTY-LICENSES.generated.html about.hbs
          sed -i 's/\r$//' THIRD-PARTY-LICENSES.generated.html
          cmp THIRD-PARTY-LICENSES.html THIRD-PARTY-LICENSES.generated.html
