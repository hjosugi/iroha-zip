name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "23 18 * * 6"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Test immutable release inventory verifier
        shell: pwsh
        run: ./scripts/test-release-inventory.ps1

      - name: Test release PE architecture verifier
        shell: pwsh
        run: ./scripts/test-pe-architecture.ps1

      - name: Test dual-architecture release asset assembly
        shell: pwsh
        run: ./scripts/test-release-assets.ps1

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy
          rustup default 1.97.1

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ci-test-${{ matrix.os }}
          workspaces: |
            . -> target
            fuzz -> target
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run tests
        run: cargo test --all-targets --locked

      - name: Run minimized fuzz regressions
        if: runner.os == 'Linux'
        run: cargo test --locked --features fuzzing --test fuzz_regressions

      - name: Type-check the locked fuzz workspace
        if: runner.os == 'Linux'
        run: cargo check --manifest-path fuzz/Cargo.toml --all-targets --locked

      - name: Run Clippy
        run: cargo clippy --all-targets --locked

      - name: Exercise backend install rollback transaction
        shell: pwsh
        run: |
          cargo build --bin iroha-zip --locked
          ./scripts/test-backend-install-rollback.ps1

      - name: Build Windows UI binary
        if: runner.os == 'Windows'
        run: cargo build --bins --locked

      - name: Exercise native settings accessibility contract
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/test-settings-ui.ps1 `
            -Executable ./target/debug/iroha-zip-settings.exe `
            -Language ja
          ./scripts/test-settings-ui.ps1 `
            -Executable ./target/debug/iroha-zip-settings.exe `
            -Language en

      - name: Exercise association registration round trip
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          ./scripts/test-associations.ps1
          -ShellExecutable ./target/debug/iroha-zip-shell.exe

  windows-arm64-native:
    name: Test Windows ARM64 natively
    runs-on: windows-11-arm
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install a current MSYS2 CLANGARM64 libarchive source
        id: arm_msys2
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2.32.0
        with:
          msystem: CLANGARM64
          update: true
          cache: true
          install: mingw-w64-clang-aarch64-libarchive

      - name: Install pinned native Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy
          rustup default 1.97.1

      - name: Require a native ARM64 host toolchain
        shell: pwsh
        run: |
          $os = [System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString()
          $process = [System.Runtime.InteropServices.RuntimeInformation]::ProcessArchitecture.ToString()
          $hostLine = rustc -vV | Where-Object { $_ -like 'host:*' }
          if ($os -cne 'Arm64' -or $process -cne 'Arm64' -or
              $hostLine -cne 'host: aarch64-pc-windows-msvc') {
            throw "Expected native ARM64 execution; os=$os process=$process rust=$hostLine"
          }

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ci-windows-arm64-native
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run native tests
        run: cargo test --all-targets --locked

      - name: Run native Clippy
        run: cargo clippy --all-targets --locked

      - name: Build native release executables
        run: cargo build --release --bins --locked

      - name: Export a verified native ARM64 backend
        shell: pwsh
        env:
          MSYS2_ROOT: ${{ steps.arm_msys2.outputs.msys2-location }}
        run: >-
          ./scripts/export-msys2-backend.ps1
          -Msys2Root $env:MSYS2_ROOT
          -Environment CLANGARM64
          -DestinationDirectory (Join-Path $env:RUNNER_TEMP 'iroha-zip-arm64-backend')

      - name: Exercise native ARM64 archive and isolation matrix
        shell: pwsh
        run: >-
          ./scripts/test-windows-e2e.ps1
          -Executable ./target/release/iroha-zip.exe
          -ShellExecutable ./target/release/iroha-zip-shell.exe
          -BackendDirectory (Join-Path $env:RUNNER_TEMP 'iroha-zip-arm64-backend')
          -EvidenceOutput (Join-Path $env:RUNNER_TEMP 'windows-arm64-e2e.json')

      - name: Exercise native ARM64 malicious archive corpus
        shell: pwsh
        env:
          IROHA_ZIP_CORPUS_BACKEND: ${{ runner.temp }}/iroha-zip-arm64-backend
          IROHA_ZIP_CORPUS_EVIDENCE: ${{ runner.temp }}/windows-arm64-malicious-corpus.json
        run: |
          $builtExecutable = Join-Path $env:GITHUB_WORKSPACE 'target/release/iroha-zip.exe'
          $runtimeRoot = Join-Path $env:RUNNER_TEMP `
            ("iroha-zip-arm64-corpus-" + [Guid]::NewGuid().ToString('N'))
          $runtimeExecutable = Join-Path $runtimeRoot 'iroha-zip.exe'
          New-Item -ItemType Directory -Path $runtimeRoot | Out-Null
          try {
            Copy-Item -LiteralPath $builtExecutable -Destination $runtimeExecutable
            if ((Get-FileHash -LiteralPath $builtExecutable -Algorithm SHA256).Hash -cne
                (Get-FileHash -LiteralPath $runtimeExecutable -Algorithm SHA256).Hash) {
              throw 'Independent ARM64 corpus executable differs from the Cargo build.'
            }
            $env:IROHA_ZIP_CORPUS_EXECUTABLE = $runtimeExecutable
            cargo test --test malicious_archive_corpus --locked -- --ignored --nocapture
            if ($LASTEXITCODE -ne 0) {
              throw "Native ARM64 malicious corpus failed with exit code $LASTEXITCODE."
            }
          }
          finally {
            Remove-Item -LiteralPath $runtimeRoot -Recurse -Force -ErrorAction SilentlyContinue
          }

      - name: Exercise native ARM64 settings setup and diagnosis
        shell: pwsh
        run: |
          ./scripts/test-settings-ui.ps1 `
            -Executable ./target/release/iroha-zip-settings.exe `
            -BackendDirectory (Join-Path $env:RUNNER_TEMP 'iroha-zip-arm64-backend') `
            -EvidenceOutput (Join-Path $env:RUNNER_TEMP 'windows-arm64-settings-ja.json') `
            -Language ja
          ./scripts/test-settings-ui.ps1 `
            -Executable ./target/release/iroha-zip-settings.exe `
            -BackendDirectory (Join-Path $env:RUNNER_TEMP 'iroha-zip-arm64-backend') `
            -EvidenceOutput (Join-Path $env:RUNNER_TEMP 'windows-arm64-settings-en.json') `
            -Language en

      - name: Verify ARM64 PE inventory and AppContainer evidence
        shell: pwsh
        run: |
          $root = Join-Path $env:GITHUB_WORKSPACE 'target/release'
          $expected = @(
            'iroha-zip.exe',
            'iroha-zip-settings.exe',
            'iroha-zip-shell.exe'
          )
          foreach ($name in $expected) {
            $path = Join-Path $root $name
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "ARM64 executable is missing: $name"
            }
            $bytes = [IO.File]::ReadAllBytes($path)
            if ($bytes.Length -lt 68 -or $bytes[0] -ne 0x4d -or $bytes[1] -ne 0x5a) {
              throw "ARM64 executable has no valid DOS header: $name"
            }
            $peOffset = [BitConverter]::ToInt32($bytes, 0x3c)
            if ($peOffset -lt 64 -or $peOffset + 6 -gt $bytes.Length -or
                $bytes[$peOffset] -ne 0x50 -or $bytes[$peOffset + 1] -ne 0x45 -or
                $bytes[$peOffset + 2] -ne 0 -or $bytes[$peOffset + 3] -ne 0) {
              throw "ARM64 executable has no valid PE signature: $name"
            }
            $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)
            if ($machine -ne 0xaa64) {
              throw ("Expected ARM64 PE machine 0xAA64 for {0}; found 0x{1:X4}" -f `
                $name, $machine)
            }
          }

          $backendRoot = Join-Path $env:RUNNER_TEMP 'iroha-zip-arm64-backend'
          $backendFiles = @(
            Get-ChildItem -LiteralPath $backendRoot -File |
              Where-Object { $_.Extension -in @('.exe', '.dll') } |
              Sort-Object -Property Name
          )
          if ($backendFiles.Count -lt 2 -or
              @($backendFiles | Where-Object { $_.Name -ceq 'bsdtar.exe' }).Count -ne 1) {
            throw 'Native ARM64 backend PE inventory is incomplete.'
          }
          $backendInventory = @(
            foreach ($file in $backendFiles) {
              $bytes = [IO.File]::ReadAllBytes($file.FullName)
              if ($bytes.Length -lt 68 -or $bytes[0] -ne 0x4d -or $bytes[1] -ne 0x5a) {
                throw "Backend payload has no valid DOS header: $($file.Name)"
              }
              $peOffset = [BitConverter]::ToInt32($bytes, 0x3c)
              if ($peOffset -lt 64 -or $peOffset + 6 -gt $bytes.Length -or
                  $bytes[$peOffset] -ne 0x50 -or $bytes[$peOffset + 1] -ne 0x45 -or
                  $bytes[$peOffset + 2] -ne 0 -or $bytes[$peOffset + 3] -ne 0) {
                throw "Backend payload has no valid PE signature: $($file.Name)"
              }
              $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)
              if ($machine -ne 0xaa64) {
                throw ("Expected ARM64 backend PE 0xAA64 for {0}; found 0x{1:X4}" -f `
                  $file.Name, $machine)
              }
              [ordered]@{
                name = $file.Name
                sha256 = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              }
            }
          )

          $builtExecutable = Join-Path $root 'iroha-zip.exe'
          # rust-cache may restore target artifacts as hard links. Production
          # correctly rejects those as probe inputs, so exercise an ordinary
          # byte-for-byte copy like the packaged executable instead.
          $probeId = [Guid]::NewGuid().ToString('N')
          $executable = Join-Path $env:RUNNER_TEMP "iroha-zip-arm64-probe-$probeId.exe"
          [IO.File]::Copy($builtExecutable, $executable, $false)
          $config = Join-Path $env:RUNNER_TEMP "iroha-zip-arm64-config-$probeId.toml"
          & $executable --config $config init-config
          if ($LASTEXITCODE -ne 0) {
            throw "ARM64 default configuration failed with exit code $LASTEXITCODE."
          }
          $json = & $executable --config $config isolation-report | Out-String
          if ($LASTEXITCODE -ne 0) {
            throw "ARM64 isolation report failed with exit code $LASTEXITCODE."
          }
          $isolation = $json | ConvertFrom-Json -Depth 20
          $cleanup = @($isolation.cleanup)
          if ($isolation.schemaVersion -ne 4 -or
              $isolation.requestedMode -cne 'appcontainer' -or
              -not $isolation.token.isAppContainer -or
              $isolation.token.isLessPrivilegedAppContainer -or
              $isolation.token.capabilityCount -ne 0 -or
              -not $isolation.network.denied -or
              -not $isolation.timeout.rejected -or
              -not $isolation.memory.rejected -or
              -not $isolation.crash.terminatedWithoutSuccess -or
              $isolation.crash.exitCode -eq 0 -or
              -not $isolation.loaderFailure.createProcessRejected -or
              -not $isolation.processTemp.rngSucceeded -or
              -not $isolation.processTemp.deleteOnCloseSucceeded -or
              -not $isolation.stagingWriteSeal.aclApplied -or
              $cleanup.Count -ne 7 -or
              @($cleanup | Where-Object {
                -not $_.profileDeleteSucceeded -or -not $_.temporaryRootRemoved
              }).Count -ne 0) {
            throw 'Native ARM64 isolation evidence did not satisfy the complete contract.'
          }
          $binaryHash = (Get-FileHash -LiteralPath $executable -Algorithm SHA256).Hash.ToLowerInvariant()
          $builtHash = (Get-FileHash -LiteralPath $builtExecutable -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($binaryHash -cne $builtHash) {
            throw 'ARM64 isolation probe copy differs from the release build.'
          }
          if ($isolation.probeSha256 -cne $binaryHash) {
            throw 'ARM64 isolation probe did not execute the release binary bytes.'
          }

          $configText = [IO.File]::ReadAllText($config)
          $isolationMarker = 'isolation = "appcontainer"'
          if ([regex]::Matches(
              $configText,
              [regex]::Escape($isolationMarker)
            ).Count -ne 1) {
            throw 'ARM64 configuration did not contain exactly one isolation marker.'
          }
          $lpacConfig = Join-Path $env:RUNNER_TEMP "iroha-zip-arm64-lpac-$probeId.toml"
          [IO.File]::WriteAllText(
            $lpacConfig,
            $configText.Replace($isolationMarker, 'isolation = "lpac"'),
            [Text.UTF8Encoding]::new($false)
          )
          $lpacStart = [Diagnostics.ProcessStartInfo]::new()
          $lpacStart.FileName = $executable
          $lpacStart.UseShellExecute = $false
          $lpacStart.CreateNoWindow = $true
          $lpacStart.RedirectStandardOutput = $true
          $lpacStart.RedirectStandardError = $true
          foreach ($argument in @('--config', $lpacConfig, 'isolation-report')) {
            $lpacStart.ArgumentList.Add($argument)
          }
          $lpacProcess = [Diagnostics.Process]::new()
          $lpacProcess.StartInfo = $lpacStart
          try {
            if (-not $lpacProcess.Start()) {
              throw 'Native ARM64 LPAC probe did not start.'
            }
            $lpacStdoutTask = $lpacProcess.StandardOutput.ReadToEndAsync()
            $lpacStderrTask = $lpacProcess.StandardError.ReadToEndAsync()
            if (-not $lpacProcess.WaitForExit(120000)) {
              $lpacProcess.Kill($true)
              $lpacProcess.WaitForExit()
              throw 'Native ARM64 LPAC probe exceeded 120 seconds.'
            }
            $lpacExitCode = $lpacProcess.ExitCode
            $lpacStdout = $lpacStdoutTask.GetAwaiter().GetResult()
            $lpacStderr = $lpacStderrTask.GetAwaiter().GetResult()
          }
          finally {
            $lpacProcess.Dispose()
          }
          if ($lpacExitCode -eq 0) {
            $lpacIsolation = $lpacStdout | ConvertFrom-Json -Depth 20
            $lpacCleanup = @($lpacIsolation.cleanup)
            if ($lpacIsolation.schemaVersion -ne 4 -or
                $lpacIsolation.requestedMode -cne 'lpac' -or
                -not $lpacIsolation.token.isAppContainer -or
                -not $lpacIsolation.token.isLessPrivilegedAppContainer -or
                $lpacIsolation.token.capabilityCount -ne 0 -or
                -not $lpacIsolation.network.denied -or
                -not $lpacIsolation.timeout.rejected -or
                -not $lpacIsolation.memory.rejected -or
                -not $lpacIsolation.crash.terminatedWithoutSuccess -or
                $lpacIsolation.crash.exitCode -eq 0 -or
                -not $lpacIsolation.loaderFailure.createProcessRejected -or
                -not $lpacIsolation.processTemp.rngSucceeded -or
                -not $lpacIsolation.processTemp.deleteOnCloseSucceeded -or
                -not $lpacIsolation.stagingWriteSeal.aclApplied -or
                $lpacCleanup.Count -ne 7 -or
                @($lpacCleanup | Where-Object {
                  -not $_.profileDeleteSucceeded -or -not $_.temporaryRootRemoved
                }).Count -ne 0 -or
                $lpacIsolation.probeSha256 -cne $binaryHash) {
              throw 'Native ARM64 LPAC evidence did not satisfy the complete contract.'
            }
            $lpacEvidence = [ordered]@{
              supported = $true
              failureClass = $null
              failClosed = $true
              isolation = $lpacIsolation
            }
          }
          elseif ($lpacExitCode -eq 2 -and
              [string]::IsNullOrWhiteSpace($lpacStdout) -and
              $lpacStderr -match `
                'GetTokenInformation\(TokenIsLessPrivilegedAppContainer\) failed: The parameter is incorrect\.') {
            $lpacEvidence = [ordered]@{
              supported = $false
              failureClass = 'token-query-invalid-parameter'
              failClosed = $true
              isolation = [ordered]@{
                exitCode = $lpacExitCode
                stdoutEmpty = $true
                stderrSha256 = [Convert]::ToHexString(
                  [Security.Cryptography.SHA256]::HashData(
                    [Text.Encoding]::UTF8.GetBytes($lpacStderr)
                  )
                ).ToLowerInvariant()
              }
            }
          }
          else {
            throw "Native ARM64 LPAC probe failed unexpectedly: exit=$lpacExitCode stderr=$($lpacStderr.Trim())"
          }
          $evidence = [ordered]@{
            schemaVersion = 2
            runner = [ordered]@{
              osDescription = [System.Runtime.InteropServices.RuntimeInformation]::OSDescription
              osArchitecture = [System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString()
              processArchitecture = [System.Runtime.InteropServices.RuntimeInformation]::ProcessArchitecture.ToString()
              imageOs = $env:ImageOS
              imageVersion = $env:ImageVersion
            }
            rustHost = (rustc -vV | Where-Object { $_ -like 'host:*' })
            binarySha256 = $binaryHash
            peMachine = '0xAA64'
            backendPeMachine = '0xAA64'
            backendPayloads = $backendInventory
            isolation = $isolation
            lpac = $lpacEvidence
            backendArchiveMatrixExecuted = $true
            maliciousCorpusExecuted = $true
            settingsMatrixExecuted = $true
            releaseAssetPublished = $false
          }
          $evidencePath = Join-Path $env:RUNNER_TEMP 'windows-arm64-native.json'
          [IO.File]::WriteAllText(
            $evidencePath,
            (ConvertTo-Json -InputObject $evidence -Depth 30),
            [Text.UTF8Encoding]::new($false)
          )
          Write-Host 'Verified three native ARM64 PEs and AppContainer/LPAC evidence; no binary artifact was published.'

      - name: Upload native ARM64 evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-arm64-native
          path: |
            ${{ runner.temp }}/windows-arm64-native.json
            ${{ runner.temp }}/windows-arm64-e2e.json
            ${{ runner.temp }}/windows-arm64-malicious-corpus.json
            ${{ runner.temp }}/windows-arm64-settings-ja.json
            ${{ runner.temp }}/windows-arm64-settings-en.json
          if-no-files-found: warn
          retention-days: 14

  windows-e2e:
    # The fixed-label AppContainer/backend matrix is deliberately separated
    # from the fast required checks. It runs weekly or when explicitly started,
    # and still fails visibly and preserves evidence when an integration breaks.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install a current MSYS2 UCRT64 libarchive source
        id: msys2
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2.32.0
        with:
          msystem: UCRT64
          update: true
          cache: true
          install: mingw-w64-ucrt-x86_64-libarchive

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ci-e2e-${{ matrix.os }}
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build release binaries
        run: cargo build --release --locked

      - name: Export a verified backend
        shell: pwsh
        env:
          MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        run: >-
          ./scripts/export-msys2-backend.ps1
          -Msys2Root $env:MSYS2_ROOT
          -DestinationDirectory (Join-Path $env:RUNNER_TEMP 'iroha-zip-e2e-backend')

      - name: Verify supported and unsupported backend evidence flows
        if: matrix.os == 'windows-2025'
        shell: pwsh
        run: |
          $verified = Join-Path $env:RUNNER_TEMP 'iroha-zip-e2e-backend'
          ./target/release/iroha-zip.exe verify-backend-evidence `
            $verified --require-supported
          if ($LASTEXITCODE -ne 0) {
            throw 'Supported MSYS2 evidence validation failed.'
          }

          $localSource = Join-Path $env:RUNNER_TEMP 'iroha-zip-local-source'
          $localBackend = Join-Path $env:RUNNER_TEMP 'iroha-zip-local-backend'
          New-Item -ItemType Directory -Path $localSource | Out-Null
          New-Item -ItemType Directory -Path $localBackend | Out-Null
          New-Item -ItemType Directory `
            -Path (Join-Path $localSource '.iroha-zip-evidence') | Out-Null
          [IO.File]::WriteAllBytes(
            (Join-Path $localSource 'bsdtar.exe'),
            [Text.Encoding]::UTF8.GetBytes('test backend')
          )
          [IO.File]::WriteAllText(
            (Join-Path $localSource '.iroha-zip-evidence/stale.txt'),
            'stale evidence'
          )
          [IO.File]::WriteAllText(
            (Join-Path $localSource '.iroha-zip-evidence-notes.bin'),
            'ordinary payload with a similar name'
          )
          [IO.File]::WriteAllText(
            (Join-Path $localBackend 'preserve.marker'),
            'existing backend'
          )
          $rejected = $false
          try {
            ./scripts/install-backend.ps1 `
              -SourceDirectory $localSource `
              -DestinationDirectory $localBackend
          }
          catch {
            $rejected = $true
          }
          if (-not $rejected) {
            throw 'An unapproved local bundle was unexpectedly accepted.'
          }
          if (-not (Test-Path -LiteralPath `
              (Join-Path $localBackend 'preserve.marker') -PathType Leaf)) {
            throw 'Rejected import did not preserve the existing backend.'
          }

          ./scripts/install-backend.ps1 `
            -SourceDirectory $localSource `
            -DestinationDirectory $localBackend `
            -AllowUnsupportedSource
          if (Test-Path -LiteralPath `
              (Join-Path $localBackend '.iroha-zip-evidence/stale.txt')) {
            throw 'Stale source evidence was unexpectedly reused.'
          }
          if (-not (Test-Path -LiteralPath `
              (Join-Path $localBackend '.iroha-zip-evidence-notes.bin') `
              -PathType Leaf)) {
            throw 'An ordinary payload with a similar name was incorrectly excluded.'
          }
          ./target/release/iroha-zip.exe verify-backend-evidence $localBackend
          if ($LASTEXITCODE -ne 0) {
            throw 'Explicitly unsupported evidence validation failed.'
          }
          ./target/release/iroha-zip.exe verify-backend-evidence `
            $localBackend --require-supported
          if ($LASTEXITCODE -eq 0) {
            throw 'Unsupported evidence unexpectedly passed --require-supported.'
          }
          $global:LASTEXITCODE = 0

          Add-Content `
            -LiteralPath (Join-Path $localBackend '.iroha-zip-evidence/THIRD-PARTY-NOTICES.md') `
            -Value 'tampered'
          ./target/release/iroha-zip.exe verify-backend-evidence $localBackend
          if ($LASTEXITCODE -eq 0) {
            throw 'Tampered evidence unexpectedly passed validation.'
          }
          $global:LASTEXITCODE = 0

      - name: Enable failure-only backend crash evidence
        shell: pwsh
        run: |
          $dumpRoot = Join-Path $env:RUNNER_TEMP 'bsdtar-crash-dumps'
          New-Item -ItemType Directory -Path $dumpRoot -Force | Out-Null
          $key = 'HKCU:\Software\Microsoft\Windows\Windows Error Reporting\LocalDumps\bsdtar.exe'
          New-Item -Path $key -Force | Out-Null
          New-ItemProperty -Path $key -Name DumpFolder -PropertyType ExpandString -Value $dumpRoot -Force | Out-Null
          New-ItemProperty -Path $key -Name DumpCount -PropertyType DWord -Value 2 -Force | Out-Null
          New-ItemProperty -Path $key -Name DumpType -PropertyType DWord -Value 1 -Force | Out-Null

      - name: Exercise archive and isolation matrix
        shell: pwsh
        run: >-
          ./scripts/test-windows-e2e.ps1
          -Executable ./target/release/iroha-zip.exe
          -ShellExecutable ./target/release/iroha-zip-shell.exe
          -BackendDirectory (Join-Path $env:RUNNER_TEMP 'iroha-zip-e2e-backend')
          -EvidenceOutput (Join-Path $env:RUNNER_TEMP 'windows-e2e.json')

      - name: Exercise generated malicious archive corpus
        shell: pwsh
        env:
          IROHA_ZIP_CORPUS_BACKEND: ${{ runner.temp }}/iroha-zip-e2e-backend
          IROHA_ZIP_CORPUS_EVIDENCE: ${{ runner.temp }}/malicious-corpus.json
        run: |
          $builtExecutable = Join-Path $env:GITHUB_WORKSPACE 'target/release/iroha-zip.exe'
          $runtimeRoot = Join-Path $env:RUNNER_TEMP `
            ("iroha-zip-corpus-runtime-" + [Guid]::NewGuid().ToString('N'))
          $runtimeExecutable = Join-Path $runtimeRoot 'iroha-zip.exe'
          New-Item -ItemType Directory -Path $runtimeRoot | Out-Null
          try {
            Copy-Item -LiteralPath $builtExecutable -Destination $runtimeExecutable
            $builtHash = (Get-FileHash -LiteralPath $builtExecutable -Algorithm SHA256).Hash
            $runtimeHash = (Get-FileHash -LiteralPath $runtimeExecutable -Algorithm SHA256).Hash
            if ($builtHash -cne $runtimeHash) {
              throw 'Independent corpus executable does not match the Cargo build artifact.'
            }
            $env:IROHA_ZIP_CORPUS_EXECUTABLE = $runtimeExecutable
            cargo test --test malicious_archive_corpus --locked -- `
              --ignored --nocapture
            if ($LASTEXITCODE -ne 0) {
              throw "Malicious archive corpus failed with exit code $LASTEXITCODE."
            }
          }
          finally {
            Remove-Item -LiteralPath $runtimeRoot -Recurse -Force -ErrorAction SilentlyContinue
          }

      - name: Exercise settings-screen setup and diagnosis
        shell: pwsh
        run: >-
          ./scripts/test-settings-ui.ps1
          -Executable ./target/release/iroha-zip-settings.exe
          -BackendDirectory (Join-Path $env:RUNNER_TEMP 'iroha-zip-e2e-backend')
          -EvidenceOutput (Join-Path $env:RUNNER_TEMP 'settings-e2e.json')
          -Language en

      - name: Summarize backend crash evidence
        if: failure()
        shell: pwsh
        run: |
          Get-WinEvent -FilterHashtable @{
            LogName = 'Application'
            StartTime = [DateTime]::UtcNow.AddMinutes(-30)
          } -ErrorAction SilentlyContinue |
            Where-Object { $_.Message -match 'bsdtar' } |
            Select-Object -First 10 TimeCreated, ProviderName, Id, Message |
            Format-List
          $dumpRoot = Join-Path $env:RUNNER_TEMP 'bsdtar-crash-dumps'
          $dumps = @(Get-ChildItem -LiteralPath $dumpRoot -Filter '*.dmp' -ErrorAction SilentlyContinue)
          $debugger = @(
            "${env:ProgramFiles(x86)}\Windows Kits\10\Debuggers\x64\cdb.exe",
            "$env:ProgramFiles\Windows Kits\10\Debuggers\x64\cdb.exe"
          ) | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          foreach ($dump in $dumps) {
            Write-Host "Crash dump: $($dump.FullName) ($($dump.Length) bytes)"
            if ($null -ne $debugger) {
              & $debugger -z $dump.FullName -c '!analyze -v; .ecxr; k; q'
            }
          }

      - name: Upload machine-readable Windows evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-e2e-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/windows-e2e.json
            ${{ runner.temp }}/settings-e2e.json
            ${{ runner.temp }}/malicious-corpus.json
            ${{ runner.temp }}/bsdtar-crash-dumps/*.dmp
          if-no-files-found: warn
          retention-days: 14

  dependency-policy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1

      - name: Restore Rust tool cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ci-dependency-policy
          cache-all-crates: true
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install pinned dependency-policy tools
        run: |
          cargo install cargo-deny --version 0.19.9 --locked
          cargo install cargo-about --version 0.9.1 --locked --features cli

      - name: Check advisories, licenses, bans, and sources
        run: cargo deny check

      - name: Check fuzz-workspace dependencies
        run: >-
          cargo deny --manifest-path fuzz/Cargo.toml --locked check
          --config fuzz/deny.toml

      - name: Verify generated third-party license inventory
        shell: bash
        run: |
          cargo about generate --locked --all-features -o THIRD-PARTY-LICENSES.generated.html about.hbs
          sed -i 's/\r$//' THIRD-PARTY-LICENSES.generated.html
          cmp THIRD-PARTY-LICENSES.html THIRD-PARTY-LICENSES.generated.html
