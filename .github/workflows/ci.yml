name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "23 18 * * 6"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Test immutable release inventory verifier
        shell: pwsh
        run: ./scripts/test-release-inventory.ps1

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy
          rustup default 1.97.1

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ci-test-${{ matrix.os }}
          workspaces: |
            . -> target
            fuzz -> target
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run tests
        run: cargo test --all-targets --locked

      - name: Run minimized fuzz regressions
        if: runner.os == 'Linux'
        run: cargo test --locked --features fuzzing --test fuzz_regressions

      - name: Type-check the locked fuzz workspace
        if: runner.os == 'Linux'
        run: cargo check --manifest-path fuzz/Cargo.toml --all-targets --locked

      - name: Run Clippy
        run: cargo clippy --all-targets --locked

      - name: Build Windows UI binary
        if: runner.os == 'Windows'
        run: cargo build --bins --locked

      - name: Exercise native settings accessibility contract
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/test-settings-ui.ps1 `
            -Executable ./target/debug/iroha-zip-settings.exe `
            -Language ja
          ./scripts/test-settings-ui.ps1 `
            -Executable ./target/debug/iroha-zip-settings.exe `
            -Language en

      - name: Exercise association registration round trip
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          ./scripts/test-associations.ps1
          -ShellExecutable ./target/debug/iroha-zip-shell.exe

  windows-arm64-build:
    name: Link Windows ARM64 executables
    runs-on: windows-2025
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install pinned Rust toolchain and ARM64 target
        shell: bash
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1
          rustup target add aarch64-pc-windows-msvc

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ci-windows-arm64-link
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Link release executables
        run: >-
          cargo build --release --bins
          --target aarch64-pc-windows-msvc --locked

      - name: Verify exact ARM64 PE inventory
        shell: pwsh
        run: |
          $root = Join-Path $env:GITHUB_WORKSPACE `
            'target/aarch64-pc-windows-msvc/release'
          $expected = @(
            'iroha-zip.exe',
            'iroha-zip-settings.exe',
            'iroha-zip-shell.exe'
          )
          foreach ($name in $expected) {
            $path = Join-Path $root $name
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "ARM64 executable is missing: $name"
            }
            $bytes = [IO.File]::ReadAllBytes($path)
            if ($bytes.Length -lt 68 -or $bytes[0] -ne 0x4d -or $bytes[1] -ne 0x5a) {
              throw "ARM64 executable has no valid DOS header: $name"
            }
            $peOffset = [BitConverter]::ToInt32($bytes, 0x3c)
            if ($peOffset -lt 64 -or $peOffset + 6 -gt $bytes.Length -or
                $bytes[$peOffset] -ne 0x50 -or $bytes[$peOffset + 1] -ne 0x45 -or
                $bytes[$peOffset + 2] -ne 0 -or $bytes[$peOffset + 3] -ne 0) {
              throw "ARM64 executable has no valid PE signature: $name"
            }
            $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)
            if ($machine -ne 0xaa64) {
              throw ("Expected ARM64 PE machine 0xAA64 for {0}; found 0x{1:X4}" -f `
                $name, $machine)
            }
          }
          Write-Host 'Verified three linked ARM64 PE executables; no artifact was published.'

  windows-e2e:
    # The fixed-label AppContainer/backend matrix is deliberately separated
    # from the fast required checks. It runs weekly or when explicitly started,
    # and still fails visibly and preserves evidence when an integration breaks.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install a current MSYS2 UCRT64 libarchive source
        id: msys2
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2.32.0
        with:
          msystem: UCRT64
          update: true
          cache: true
          install: mingw-w64-ucrt-x86_64-libarchive

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ci-e2e-${{ matrix.os }}
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build release binaries
        run: cargo build --release --locked

      - name: Export a verified backend
        shell: pwsh
        env:
          MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        run: >-
          ./scripts/export-msys2-backend.ps1
          -Msys2Root $env:MSYS2_ROOT
          -DestinationDirectory (Join-Path $env:RUNNER_TEMP 'iroha-zip-e2e-backend')

      - name: Verify supported and unsupported backend evidence flows
        if: matrix.os == 'windows-2025'
        shell: pwsh
        run: |
          $verified = Join-Path $env:RUNNER_TEMP 'iroha-zip-e2e-backend'
          ./target/release/iroha-zip.exe verify-backend-evidence `
            $verified --require-supported
          if ($LASTEXITCODE -ne 0) {
            throw 'Supported MSYS2 evidence validation failed.'
          }

          $localSource = Join-Path $env:RUNNER_TEMP 'iroha-zip-local-source'
          $localBackend = Join-Path $env:RUNNER_TEMP 'iroha-zip-local-backend'
          New-Item -ItemType Directory -Path $localSource | Out-Null
          New-Item -ItemType Directory -Path $localBackend | Out-Null
          New-Item -ItemType Directory `
            -Path (Join-Path $localSource '.iroha-zip-evidence') | Out-Null
          [IO.File]::WriteAllBytes(
            (Join-Path $localSource 'bsdtar.exe'),
            [Text.Encoding]::UTF8.GetBytes('test backend')
          )
          [IO.File]::WriteAllText(
            (Join-Path $localSource '.iroha-zip-evidence/stale.txt'),
            'stale evidence'
          )
          [IO.File]::WriteAllText(
            (Join-Path $localSource '.iroha-zip-evidence-notes.bin'),
            'ordinary payload with a similar name'
          )
          [IO.File]::WriteAllText(
            (Join-Path $localBackend 'preserve.marker'),
            'existing backend'
          )
          $rejected = $false
          try {
            ./scripts/install-backend.ps1 `
              -SourceDirectory $localSource `
              -DestinationDirectory $localBackend
          }
          catch {
            $rejected = $true
          }
          if (-not $rejected) {
            throw 'An unapproved local bundle was unexpectedly accepted.'
          }
          if (-not (Test-Path -LiteralPath `
              (Join-Path $localBackend 'preserve.marker') -PathType Leaf)) {
            throw 'Rejected import did not preserve the existing backend.'
          }
          ./scripts/install-backend.ps1 `
            -SourceDirectory $localSource `
            -DestinationDirectory $localBackend `
            -AllowUnsupportedSource
          if (Test-Path -LiteralPath `
              (Join-Path $localBackend '.iroha-zip-evidence/stale.txt')) {
            throw 'Stale source evidence was unexpectedly reused.'
          }
          if (-not (Test-Path -LiteralPath `
              (Join-Path $localBackend '.iroha-zip-evidence-notes.bin') `
              -PathType Leaf)) {
            throw 'An ordinary payload with a similar name was incorrectly excluded.'
          }
          ./target/release/iroha-zip.exe verify-backend-evidence $localBackend
          if ($LASTEXITCODE -ne 0) {
            throw 'Explicitly unsupported evidence validation failed.'
          }
          ./target/release/iroha-zip.exe verify-backend-evidence `
            $localBackend --require-supported
          if ($LASTEXITCODE -eq 0) {
            throw 'Unsupported evidence unexpectedly passed --require-supported.'
          }
          $global:LASTEXITCODE = 0

          Add-Content `
            -LiteralPath (Join-Path $localBackend '.iroha-zip-evidence/THIRD-PARTY-NOTICES.md') `
            -Value 'tampered'
          ./target/release/iroha-zip.exe verify-backend-evidence $localBackend
          if ($LASTEXITCODE -eq 0) {
            throw 'Tampered evidence unexpectedly passed validation.'
          }
          $global:LASTEXITCODE = 0

      - name: Enable failure-only backend crash evidence
        shell: pwsh
        run: |
          $dumpRoot = Join-Path $env:RUNNER_TEMP 'bsdtar-crash-dumps'
          New-Item -ItemType Directory -Path $dumpRoot -Force | Out-Null
          $key = 'HKCU:\Software\Microsoft\Windows\Windows Error Reporting\LocalDumps\bsdtar.exe'
          New-Item -Path $key -Force | Out-Null
          New-ItemProperty -Path $key -Name DumpFolder -PropertyType ExpandString -Value $dumpRoot -Force | Out-Null
          New-ItemProperty -Path $key -Name DumpCount -PropertyType DWord -Value 2 -Force | Out-Null
          New-ItemProperty -Path $key -Name DumpType -PropertyType DWord -Value 1 -Force | Out-Null

      - name: Exercise archive and isolation matrix
        shell: pwsh
        run: >-
          ./scripts/test-windows-e2e.ps1
          -Executable ./target/release/iroha-zip.exe
          -ShellExecutable ./target/release/iroha-zip-shell.exe
          -BackendDirectory (Join-Path $env:RUNNER_TEMP 'iroha-zip-e2e-backend')
          -EvidenceOutput (Join-Path $env:RUNNER_TEMP 'windows-e2e.json')

      - name: Exercise generated malicious archive corpus
        shell: pwsh
        env:
          IROHA_ZIP_CORPUS_BACKEND: ${{ runner.temp }}/iroha-zip-e2e-backend
          IROHA_ZIP_CORPUS_EVIDENCE: ${{ runner.temp }}/malicious-corpus.json
        run: |
          $builtExecutable = Join-Path $env:GITHUB_WORKSPACE 'target/release/iroha-zip.exe'
          $runtimeRoot = Join-Path $env:RUNNER_TEMP `
            ("iroha-zip-corpus-runtime-" + [Guid]::NewGuid().ToString('N'))
          $runtimeExecutable = Join-Path $runtimeRoot 'iroha-zip.exe'
          New-Item -ItemType Directory -Path $runtimeRoot | Out-Null
          try {
            Copy-Item -LiteralPath $builtExecutable -Destination $runtimeExecutable
            $builtHash = (Get-FileHash -LiteralPath $builtExecutable -Algorithm SHA256).Hash
            $runtimeHash = (Get-FileHash -LiteralPath $runtimeExecutable -Algorithm SHA256).Hash
            if ($builtHash -cne $runtimeHash) {
              throw 'Independent corpus executable does not match the Cargo build artifact.'
            }
            $env:IROHA_ZIP_CORPUS_EXECUTABLE = $runtimeExecutable
            cargo test --test malicious_archive_corpus --locked -- `
              --ignored --nocapture
            if ($LASTEXITCODE -ne 0) {
              throw "Malicious archive corpus failed with exit code $LASTEXITCODE."
            }
          }
          finally {
            Remove-Item -LiteralPath $runtimeRoot -Recurse -Force -ErrorAction SilentlyContinue
          }

      - name: Exercise settings-screen setup and diagnosis
        shell: pwsh
        run: >-
          ./scripts/test-settings-ui.ps1
          -Executable ./target/release/iroha-zip-settings.exe
          -BackendDirectory (Join-Path $env:RUNNER_TEMP 'iroha-zip-e2e-backend')
          -EvidenceOutput (Join-Path $env:RUNNER_TEMP 'settings-e2e.json')
          -Language en

      - name: Summarize backend crash evidence
        if: failure()
        shell: pwsh
        run: |
          Get-WinEvent -FilterHashtable @{
            LogName = 'Application'
            StartTime = [DateTime]::UtcNow.AddMinutes(-30)
          } -ErrorAction SilentlyContinue |
            Where-Object { $_.Message -match 'bsdtar' } |
            Select-Object -First 10 TimeCreated, ProviderName, Id, Message |
            Format-List
          $dumpRoot = Join-Path $env:RUNNER_TEMP 'bsdtar-crash-dumps'
          $dumps = @(Get-ChildItem -LiteralPath $dumpRoot -Filter '*.dmp' -ErrorAction SilentlyContinue)
          $debugger = @(
            "${env:ProgramFiles(x86)}\Windows Kits\10\Debuggers\x64\cdb.exe",
            "$env:ProgramFiles\Windows Kits\10\Debuggers\x64\cdb.exe"
          ) | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          foreach ($dump in $dumps) {
            Write-Host "Crash dump: $($dump.FullName) ($($dump.Length) bytes)"
            if ($null -ne $debugger) {
              & $debugger -z $dump.FullName -c '!analyze -v; .ecxr; k; q'
            }
          }

      - name: Upload machine-readable Windows evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-e2e-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/windows-e2e.json
            ${{ runner.temp }}/settings-e2e.json
            ${{ runner.temp }}/malicious-corpus.json
            ${{ runner.temp }}/bsdtar-crash-dumps/*.dmp
          if-no-files-found: warn
          retention-days: 14

  dependency-policy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1

      - name: Restore Rust tool cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ci-dependency-policy
          cache-all-crates: true
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install pinned dependency-policy tools
        run: |
          cargo install cargo-deny --version 0.19.9 --locked
          cargo install cargo-about --version 0.9.1 --locked --features cli

      - name: Check advisories, licenses, bans, and sources
        run: cargo deny check

      - name: Check fuzz-workspace dependencies
        run: >-
          cargo deny --manifest-path fuzz/Cargo.toml --locked check
          --config fuzz/deny.toml

      - name: Verify generated third-party license inventory
        shell: bash
        run: |
          cargo about generate --locked --all-features -o THIRD-PARTY-LICENSES.generated.html about.hbs
          sed -i 's/\r$//' THIRD-PARTY-LICENSES.generated.html
          cmp THIRD-PARTY-LICENSES.html THIRD-PARTY-LICENSES.generated.html
