name: Feature request / 機能提案
description: Propose an improvement and its tradeoffs. / 改善案とtradeoffを提案します。
title: "[Feature] "
labels: ["enhancement", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / 解決したい問題
      description: What user problem should iroha-zip solve? / どの利用者課題を解決したいですか？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior / 提案する動作
    validations:
      required: true
  - type: textarea
    id: security
    attributes:
      label: Security and compatibility impact / セキュリティと互換性への影響
      description: Identify new inputs, permissions, processes, network access, or trust assumptions. / 新しい入力・権限・process・network access・信頼前提を書いてください。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered / 検討した代替案
